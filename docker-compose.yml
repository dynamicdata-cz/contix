# Lokální vývoj:   docker compose up -d db              (API a web běží přes `bun run dev`)
# Celá aplikace:   docker compose --profile full up -d --build   → http://localhost:8080
# Server:          infra/scripts/install.sh (první instalace), infra/scripts/update.sh (aktualizace)
#                  viz docs/04_operations/install.md
name: contix

services:
  db:
    image: pgvector/pgvector:pg17 # PostgreSQL 17 + pgvector (připraveno pro AI vrstvu)
    restart: unless-stopped
    environment:
      POSTGRES_USER: contix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contix}
      POSTGRES_DB: contix
    ports:
      - "${DB_BIND:-127.0.0.1:5432}:5432" # jen lokálně (vývoj, správa); na serveru lze změnit DB_BIND
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contix"]
      interval: 5s
      retries: 10

  api:
    image: contix-api:${CONTIX_TAG:-local}
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    profiles: ["full"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://contix:${POSTGRES_PASSWORD:-contix}@db:5432/contix
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      CONVERTER_URL: ${CONVERTER_URL-http://converter:3100} # prázdná hodnota v .env = vypnuto
      ENTRA_LOGIN_URL: ${ENTRA_LOGIN_URL:-https://login.microsoftonline.com}
      GRAPH_URL: ${GRAPH_URL:-https://graph.microsoft.com}
      # APP_SECRET musí být v .env (openssl rand -base64 48)
    # AI na stejném serveru (Ollama / Open WebUI na hostiteli): v aplikaci zadejte http://host.docker.internal:8080/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, converter]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: contix-web:${CONTIX_TAG:-local}
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    profiles: ["full"]
    restart: unless-stopped
    environment:
      CONTIX_DOMAIN: ${CONTIX_DOMAIN:-:80}
      CONTIX_TLS_MODE: ${CONTIX_TLS_MODE:-auto} # auto | internal | files (viz infra/proxy/Caddyfile)
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data # TLS certifikáty
      - caddy_config:/config
      - ./certs:/certs:ro # vlastní certifikát pro CONTIX_TLS_MODE=files
    depends_on: [api]

  # Převodní služba dokumentů (Word/Excel/PowerPoint → PDF, text pro vyhledávání) – jen interní síť bez internetu
  converter:
    image: contix-converter:${CONTIX_TAG:-local}
    build: { context: ., dockerfile: infra/docker/converter.Dockerfile }
    profiles: ["full"]
    restart: unless-stopped
    networks: [converter]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    volumes:
      - ./fonts:/usr/local/share/fonts/custom:ro # vlastní písma (Aptos, firemní písmo…)
    mem_limit: ${CONVERTER_MEM:-2g}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

  # Denní záloha databáze → ./backups (+ volitelně šifrování age a kopie mimo server)
  backup:
    image: contix-backup:${CONTIX_TAG:-local}
    build: { context: ., dockerfile: infra/docker/backup.Dockerfile }
    profiles: ["full", "backup"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: contix
      PGPASSWORD: ${POSTGRES_PASSWORD:-contix}
      PGDATABASE: contix
      TZ: ${TZ:-Europe/Prague}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      db: { condition: service_healthy }

networks:
  default:
  # interní síť: převodní služba nemá přístup ven (dokument nemůže stahovat vzdálené obrázky / odkazy)
  converter:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
